<title>Smart Maps A/E</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --ink:#16213A; --muted:#5a6b8c; --line:#d5deec; --ground:#eef2f9;
    --surface:#ffffff; --primary:#0277BD; --primary-weak:#cfe3f2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:#E3EAF6; --muted:#8ea0c0; --line:#223052; --ground:#070b16;
      --surface:#121A2E; --primary:#4FC3F7; --primary-weak:#17304a;
    }
  }
  :root[data-theme="dark"] {
    --ink:#E3EAF6; --muted:#8ea0c0; --line:#223052; --ground:#070b16;
    --surface:#121A2E; --primary:#4FC3F7; --primary-weak:#17304a;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:system-ui,-apple-system,"SF Pro Text",sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  header { padding:10px 16px calc(10px + env(safe-area-inset-top)) 16px; }
  .eyebrow { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--primary); font-weight:700; }
  h1 { font-size:17px; margin:2px 0 0; letter-spacing:-.01em; }
  #sm-stage { position:relative; flex:1 1 auto; min-height:0; }
  #sm-canvas { display:block; width:100%; height:100%; }
  .panel {
    background:var(--surface); border-top:1px solid var(--line);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .label { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:7px 14px; margin-top:7px; }
  .cell .k { font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .cell .v { font-size:13px; font-variant-numeric:tabular-nums; }
  #sm-route {
    margin-top:10px; font-size:11px; color:var(--muted); line-height:1.5;
    border-top:1px solid var(--line); padding-top:9px;
  }
</style>

<header>
  <div class="eyebrow">SmartMapsAE v2 · own renderer</div>
  <h1>SM Atrium — indoor navigation</h1>
</header>

<div id="sm-stage">
  <canvas id="sm-canvas"></canvas>
</div>

<div class="panel">
  <div class="label">Live state</div>
  <div class="grid">
    <div class="cell"><div class="k">Position</div><div class="v" id="sm-pos">—</div></div>
    <div class="cell"><div class="k">Accuracy</div><div class="v" id="sm-acc">—</div></div>
    <div class="cell"><div class="k">Motion</div><div class="v" id="sm-motion">—</div></div>
    <div class="cell"><div class="k">Floor</div><div class="v" id="sm-floor">—</div></div>
    <div class="cell"><div class="k">Vertical</div><div class="v" id="sm-vert">—</div></div>
  </div>
  <div id="sm-route">planning…</div>
</div>

<script>/*__FIXTURES__*/</script>
<script>/*__BUNDLE__*/</script>
