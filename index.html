<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta
      name="description"
      content="Smart Maps — a cross-platform Dynamic Spatial Engine: SM's own renderer, 3–7D indoor positioning, and multi-floor routing."
    />
    <title>Smart Maps</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* The shell's own chrome. There is deliberately no loading overlay, no
         deadline timer and no fallback screen: the engine has no start-up
         phase that can fail, so there is nothing here to rescue. The canvas is
         painted on the first frame, which the engine produces immediately. */
      :root {
        --bg: #070b14;
        --fg: #f5f7fb;
        --muted: #8a93a8;
        --hairline: rgba(255, 255, 255, 0.12);
        --panel: rgba(10, 15, 28, 0.72);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6fa;
          --fg: #0a0f1c;
          --muted: #5b6478;
          --hairline: rgba(10, 15, 28, 0.14);
          --panel: rgba(255, 255, 255, 0.78);
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI',
          Roboto, Arial, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #sm-shell {
        position: fixed;
        inset: 0;
        display: block;
      }
      #sm-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #sm-hud {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--hairline);
        backdrop-filter: blur(20px);
        pointer-events: none;
      }
      .sm-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 120px;
      }
      .sm-field-label {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .sm-field-value {
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="sm-shell">
      <canvas id="sm-canvas"></canvas>
      <div id="sm-hud">
        <div class="sm-field">
          <span class="sm-field-label">Position</span>
          <span class="sm-field-value" data-sm="place">Locating…</span>
        </div>
        <div class="sm-field">
          <span class="sm-field-label">Accuracy</span>
          <span class="sm-field-value" data-sm="quality">Searching</span>
        </div>
        <div class="sm-field">
          <span class="sm-field-label">Motion</span>
          <span class="sm-field-value" data-sm="motion">Stationary</span>
        </div>
        <div class="sm-field">
          <span class="sm-field-label">Level</span>
          <span class="sm-field-value" data-sm="floor">Outdoors</span>
        </div>
      </div>
    </div>
    <noscript>
      <p style="padding: 24px">Smart Maps requires JavaScript.</p>
    </noscript>
    <script type="module" src="/sm-platform-web/main.ts"></script>
  </body>
</html>
