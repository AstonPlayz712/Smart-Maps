#
# Android builds — fully native pipeline. Produces two APK artifacts per run:
#
#   • smartmaps-ae-debug-apk  — the native Smart Maps A/E app
#                               (Kotlin + Jetpack Compose, native/android)
#   • devshell-debug-apk      — the native sandbox (Kotlin + JNI + CMake,
#                               com.smartmaps.devshell)
#
# No Appflow, no Capacitor, no web bundle: both jobs are pure Gradle.
#
# Triggers:
#   • push to main / claude branches (with path filters)
#   • manual workflow_dispatch with a target selector
#

name: Android builds

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'native/android/**'
      - 'devshell/android/**'
      - 'devshell/native/**'
      - '.github/workflows/android-builds.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which app to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - main
          - devshell

# Single concurrent run per branch — re-pushing cancels the previous build
# so we don't spend minutes on stale APKs.
concurrency:
  group: android-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Smart Maps A/E (native Kotlin + Jetpack Compose) ───────────────────
  main-app:
    name: Build Smart Maps A/E (APK)
    if: ${{ github.event_name == 'push' || github.event.inputs.target != 'devshell' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Make gradlew executable
        working-directory: native/android
        run: chmod +x gradlew

      - name: Gradle assembleDebug
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartmaps-ae-debug-apk
          path: native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ─── DevShell (native Kotlin + JNI + CMake) ─────────────────────────────
  devshell:
    name: Build DevShell (APK)
    if: ${{ github.event_name == 'push' || github.event.inputs.target != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653 cmake;3.22.1'

      - name: Make gradlew executable
        working-directory: devshell/android
        run: chmod +x gradlew

      - name: Gradle assembleDebug
        working-directory: devshell/android
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload DevShell APK
        uses: actions/upload-artifact@v4
        with:
          name: devshell-debug-apk
          path: devshell/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
