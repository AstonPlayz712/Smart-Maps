#
# Android builds — cloud pipeline that runs alongside (not instead of)
# Appflow. Produces two Android APK artifacts per run:
#
#   • smart-maps-debug-apk    — the main Capacitor app (com.smartmaps.os)
#   • devshell-debug-apk      — the native sandbox (com.smartmaps.devshell)
#
# Triggers:
#   • push to main / claude branches (with path filters)
#   • manual workflow_dispatch with a target selector
#
# Why this exists: the main app builds on Appflow today, but Appflow
# misclassifies the Capacitor project periodically and we need a
# vendor-neutral path that can also build the DevShell — a fully native
# Kotlin + JNI + CMake sandbox that Appflow's pipeline can't handle.
#

name: Android builds

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'android/**'
      - 'devshell/android/**'
      - 'devshell/native/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'capacitor.config.json'
      - 'ionic.config.json'
      - 'vite.config.ts'
      - '.github/workflows/android-builds.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which app to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - main
          - devshell

# Single concurrent run per branch — re-pushing cancels the previous build
# so we don't spend minutes on stale APKs.
concurrency:
  group: android-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Main Smart Maps app (Capacitor + Vite + MapLibre) ──────────────────
  main-app:
    name: Build main Smart Maps app (APK)
    if: ${{ github.event_name == 'push' || github.event.inputs.target != 'devshell' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-maps-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ─── DevShell (native Kotlin + JNI + CMake — Capacitor-free) ────────────
  devshell:
    name: Build DevShell (APK)
    if: ${{ github.event_name == 'push' || github.event.inputs.target != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;25.2.9519653
            cmake;3.22.1

      - name: Make gradlew executable
        working-directory: devshell/android
        run: chmod +x gradlew

      - name: Gradle assembleDebug
        working-directory: devshell/android
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload DevShell APK
        uses: actions/upload-artifact@v4
        with:
          name: devshell-debug-apk
          path: devshell/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
