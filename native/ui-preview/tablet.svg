<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <pattern id="gt" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#c4d0e2" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- bezel + screen -->
  <rect x="0" y="0" width="640" height="400" rx="22" fill="#0c0f16"/>
  <rect x="10" y="10" width="620" height="380" rx="14" fill="#e7edf6"/>
  <rect x="10" y="10" width="620" height="380" rx="14" fill="url(#gt)"/>

  <!-- nav rail -->
  <rect x="10" y="10" width="62" height="380" fill="#ffffff"/>
  <line x1="72" y1="10" x2="72" y2="390" stroke="#d5deec"/>
  <rect x="20" y="30" width="42" height="16" rx="8" fill="#cfe3f2"/>
  <path d="M33 34 l-4 1.5 v9 l4 -1.5 4 1.5 4 -1.5 v-9 l-4 1.5 -4 -1.5z" fill="none" stroke="#0277BD" stroke-width="1.6"/>
  <text x="41" y="60" font-size="9" fill="#0277BD" text-anchor="middle">Map</text>
  <path d="M22 84 h3 l2 -6 4 12 3 -9 2 3 h6" fill="none" stroke="#5a6b8c" stroke-width="1.6"/>
  <text x="41" y="100" font-size="8.5" fill="#5a6b8c" text-anchor="middle">Diag…</text>

  <!-- fixed-width card pane -->
  <rect x="72" y="10" width="210" height="380" fill="#ffffff" fill-opacity="0.9"/>
  <line x1="282" y1="10" x2="282" y2="390" stroke="#d5deec"/>

  <!-- Navigate card -->
  <rect x="86" y="26" width="182" height="48" rx="12" fill="#ffffff" stroke="#d5deec"/>
  <text x="98" y="43" font-size="9" fill="#5a6b8c" letter-spacing="0.5">NAVIGATE</text>
  <text x="98" y="58" font-size="12" font-weight="600" fill="#16213A">Free drive</text>
  <text x="98" y="69" font-size="9" fill="#5a6b8c">Tracking live · On-road</text>

  <!-- Live state card, two-column -->
  <rect x="86" y="84" width="182" height="150" rx="12" fill="#ffffff" stroke="#d5deec"/>
  <text x="98" y="101" font-size="9" fill="#5a6b8c" letter-spacing="0.5">LIVE STATE</text>
  <g font-size="9.5">
    <text x="98" y="116" font-size="8" fill="#5a6b8c">POSITION</text>
    <text x="98" y="127" font-family="ui-monospace,Menlo,monospace" fill="#16213A">39.36965, 3.02457</text>
    <text x="188" y="116" font-size="8" fill="#5a6b8c">ACCURACY</text>
    <text x="188" y="127" font-family="ui-monospace,Menlo,monospace" fill="#16213A">±48 m</text>
    <text x="98" y="143" font-size="8" fill="#5a6b8c">MOTION</text><text x="98" y="154" fill="#16213A">Still</text>
    <text x="188" y="143" font-size="8" fill="#5a6b8c">CONFIDENCE</text><text x="188" y="154" font-family="ui-monospace,Menlo,monospace" fill="#16213A">83%</text>
    <text x="98" y="170" font-size="8" fill="#5a6b8c">LINK</text><text x="98" y="181" fill="#16213A">snapped</text>
    <text x="188" y="170" font-size="8" fill="#5a6b8c">UPDATE</text><text x="188" y="181" font-family="ui-monospace,Menlo,monospace" fill="#16213A">5.0 Hz</text>
    <text x="98" y="197" font-size="8" fill="#5a6b8c">HEADING</text><text x="98" y="208" font-family="ui-monospace,Menlo,monospace" fill="#16213A">28°</text>
    <text x="188" y="197" font-size="8" fill="#5a6b8c">SPEED</text><text x="188" y="208" font-family="ui-monospace,Menlo,monospace" fill="#16213A">0.0 m/s</text>
  </g>
  <g font-size="8" fill="#5a6b8c">
    <circle cx="100" cy="222" r="3.2" fill="#0277BD"/><text x="106" y="225" fill="#16213A">GPS</text>
    <circle cx="132" cy="222" r="3.2" fill="#cbd5e6"/><text x="138" y="225">Wi-Fi</text>
    <circle cx="170" cy="222" r="3.2" fill="#cbd5e6"/><text x="176" y="225">Cell</text>
    <circle cx="200" cy="222" r="3.2" fill="#cbd5e6"/><text x="206" y="225">BT</text>
    <circle cx="226" cy="222" r="3.2" fill="#cbd5e6"/><text x="232" y="225">DR</text>
  </g>

  <!-- floating search over map, centred + width-capped -->
  <rect x="360" y="24" width="200" height="38" rx="19" fill="#ffffff" stroke="#d5deec"/>
  <circle cx="380" cy="43" r="6" fill="none" stroke="#0277BD" stroke-width="2"/>
  <line x1="384" y1="47" x2="388" y2="51" stroke="#0277BD" stroke-width="2"/>
  <text x="396" y="47" font-size="11" fill="#5a6b8c">Search places, stops…</text>

  <!-- map marker over open area -->
  <circle cx="450" cy="220" r="22" fill="#0277BD" fill-opacity="0.16"/>
  <path d="M450 204 l10 26 -10 -6 -10 6 z" fill="#0277BD"/>
  <text x="296" y="380" font-size="9" fill="#5a6b8c">100 m</text>
  <rect x="296" y="384" width="40" height="3" rx="1.5" fill="#5a6b8c" opacity="0.6"/>

  <!-- vertical labelled mode cluster, right edge -->
  <g>
    <rect x="566" y="118" width="56" height="56" rx="14" fill="#0277BD"/>
    <path d="M594 130 l7 22 -7 -5 -7 5 z" fill="#ffffff"/>
    <text x="594" y="167" font-size="8.5" fill="#ffffff" text-anchor="middle">Navigate</text>
    <rect x="566" y="180" width="56" height="56" rx="14" fill="#ffffff" stroke="#d5deec"/>
    <rect x="583" y="194" width="22" height="16" rx="3" fill="none" stroke="#0277BD" stroke-width="2"/>
    <circle cx="588" cy="214" r="2" fill="#0277BD"/><circle cx="600" cy="214" r="2" fill="#0277BD"/>
    <text x="594" y="229" font-size="8.5" fill="#0277BD" text-anchor="middle">Transit</text>
    <rect x="566" y="242" width="56" height="56" rx="14" fill="#ffffff" stroke="#d5deec"/>
    <path d="M582 276 a4 4 0 0 0 4 -4 v-7 a4 4 0 0 1 4 -4 h8" fill="none" stroke="#0277BD" stroke-width="2"/>
    <circle cx="582" cy="276" r="2.2" fill="#0277BD"/>
    <text x="594" y="291" font-size="8.5" fill="#0277BD" text-anchor="middle">Plan</text>
  </g>
</svg>
