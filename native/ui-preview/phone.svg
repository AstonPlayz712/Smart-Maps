<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" font-family="system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <pattern id="gp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#c4d0e2" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- bezel + screen -->
  <rect x="0" y="0" width="300" height="600" rx="26" fill="#0c0f16"/>
  <rect x="10" y="10" width="280" height="580" rx="16" fill="#e7edf6"/>
  <rect x="10" y="10" width="280" height="580" rx="16" fill="url(#gp)"/>

  <!-- status bar -->
  <text x="24" y="30" font-size="10" fill="#5a6b8c">15:00</text>
  <text x="276" y="30" font-size="10" fill="#5a6b8c" text-anchor="end">▲ GPS · 83%</text>

  <!-- floating search -->
  <rect x="22" y="40" width="256" height="40" rx="20" fill="#ffffff" stroke="#d5deec"/>
  <circle cx="42" cy="60" r="6" fill="none" stroke="#0277BD" stroke-width="2"/>
  <line x1="46" y1="64" x2="50" y2="68" stroke="#0277BD" stroke-width="2"/>
  <text x="58" y="64" font-size="12" fill="#5a6b8c">Search places, stops, postcodes…</text>

  <!-- map position marker -->
  <circle cx="150" cy="250" r="22" fill="#0277BD" fill-opacity="0.16"/>
  <path d="M150 234 l10 26 -10 -6 -10 6 z" fill="#0277BD"/>
  <!-- scale bar -->
  <text x="24" y="300" font-size="9" fill="#5a6b8c">100 m</text>
  <rect x="24" y="304" width="40" height="3" rx="1.5" fill="#5a6b8c" opacity="0.6"/>

  <!-- compact horizontal mode cluster (right-aligned) -->
  <g>
    <rect x="150" y="352" width="40" height="40" rx="12" fill="#0277BD"/>
    <path d="M170 362 l6 18 -6 -4 -6 4 z" fill="#ffffff"/>
    <rect x="196" y="352" width="40" height="40" rx="12" fill="#ffffff" stroke="#d5deec"/>
    <rect x="208" y="365" width="16" height="12" rx="3" fill="none" stroke="#0277BD" stroke-width="2"/>
    <circle cx="211" cy="380" r="1.6" fill="#0277BD"/><circle cx="221" cy="380" r="1.6" fill="#0277BD"/>
    <rect x="242" y="352" width="40" height="40" rx="12" fill="#ffffff" stroke="#d5deec"/>
    <path d="M250 380 a3 3 0 0 0 3 -3 v-5 a3 3 0 0 1 3 -3 h6" fill="none" stroke="#0277BD" stroke-width="2"/>
    <circle cx="250" cy="380" r="1.8" fill="#0277BD"/>
  </g>

  <!-- Navigate card -->
  <rect x="22" y="402" width="256" height="52" rx="14" fill="#ffffff" stroke="#d5deec"/>
  <text x="34" y="420" font-size="10" fill="#5a6b8c" letter-spacing="0.5">NAVIGATE</text>
  <text x="34" y="435" font-size="12" font-weight="600" fill="#16213A">Free drive</text>
  <text x="34" y="448" font-size="9" fill="#5a6b8c">Tracking live — plan a route to start guidance · On-road</text>

  <!-- Live state card (single column) -->
  <rect x="22" y="460" width="256" height="82" rx="14" fill="#ffffff" stroke="#d5deec"/>
  <text x="34" y="477" font-size="10" fill="#5a6b8c" letter-spacing="0.5">LIVE STATE</text>
  <g font-size="10.5" fill="#16213A">
    <text x="34" y="492" fill="#5a6b8c">Position</text><text x="266" y="492" text-anchor="end" font-family="ui-monospace,Menlo,monospace">39.36965, 3.02457</text>
    <text x="34" y="505" fill="#5a6b8c">Accuracy</text><text x="266" y="505" text-anchor="end" font-family="ui-monospace,Menlo,monospace">±48 m</text>
    <text x="34" y="518" fill="#5a6b8c">Motion</text><text x="266" y="518" text-anchor="end">Still · 83%</text>
  </g>
  <!-- fusion strip -->
  <g font-size="8.5" fill="#5a6b8c">
    <circle cx="36" cy="532" r="3.5" fill="#0277BD"/><text x="42" y="535" fill="#16213A">GPS</text>
    <circle cx="74" cy="532" r="3.5" fill="#cbd5e6"/><text x="80" y="535">Wi-Fi</text>
    <circle cx="116" cy="532" r="3.5" fill="#cbd5e6"/><text x="122" y="535">Cell</text>
    <circle cx="150" cy="532" r="3.5" fill="#cbd5e6"/><text x="156" y="535">BT</text>
    <circle cx="182" cy="532" r="3.5" fill="#cbd5e6"/><text x="188" y="535">DR</text>
  </g>

  <!-- bottom nav -->
  <rect x="10" y="544" width="280" height="46" rx="0" fill="#ffffff"/>
  <line x1="10" y1="544" x2="290" y2="544" stroke="#d5deec"/>
  <rect x="112" y="552" width="76" height="16" rx="8" fill="#cfe3f2"/>
  <text x="150" y="575" font-size="9" fill="#0277BD" text-anchor="middle">Map</text>
  <text x="235" y="575" font-size="9" fill="#5a6b8c" text-anchor="middle">Diagnostics</text>
</svg>
